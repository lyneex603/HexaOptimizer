
name: Build ServerOptimizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build with Maven
        run: mvn -B -e -ntp clean package

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ServerOptimizer-JAR
          path: target/*.jar
          if-no-files-found: error
